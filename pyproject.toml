[project]
name = "multi-agent-memory"
version = "0.2.0"
description = "Local-first shared long-term memory for multiple AI agent CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Multi-Agent Memory contributors" }]
dependencies = ["dynaconf>=3.2,<4"]

[project.scripts]
mam = "multi_agent_memory.cli:main"
multi-agent-memory = "multi_agent_memory.cli:main"
memoryctl = "multi_agent_memory.cli:main"

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_memory"]
include = [
  "src/multi_agent_memory/**",
  "adapters/**",
  "AGENT-MEMORY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
